<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Board</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2433; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
             padding: 14px 20px; background: #1d2433; color: #fff; }
    header h1 { margin: 0; font-size: 1.25rem; }
    .status { padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .status.on { background: #1f9d55; } .status.off { background: #c53030; }
    main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
    form { margin-bottom: 16px; }
    #announcement { display: none; padding: 12px 16px; margin-bottom: 16px; border-radius: 8px;
                    background: #fff7d6; border: 1px solid #e6c200; }
    #error { color: #c53030; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e3e6ec; }
    th { background: #eef0f4; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .04em; }
    td.left { font-weight: 700; font-variant-numeric: tabular-nums; }
    tr.full td.left { color: #c53030; }
    tr.flash { animation: flash 1s ease-out; }
    @keyframes flash { from { background: #d9f7e6; } to { background: transparent; } }
    footer { text-align: center; color: #7a8294; font-size: 0.8rem; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Room board</h1>
    <span id="conn" class="status off">connecting...</span>
  </header>
  <main>
    <form id="pick">
      <label>Room code <input id="roomInput" value="ROOM-01" size="10"></label>
      <button>Show</button>
      <span id="error"></span>
    </form>
    <div id="announcement"><b>Announcement:</b> <span id="announceText"></span> <small id="announceAt"></small></div>
    <table>
      <thead><tr><th>Date</th><th>Time</th><th>Seats</th><th>Seats left</th></tr></thead>
      <tbody id="slots"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
  </main>
  <footer>Study Room Booking Service</footer>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let roomCode = (params.get('room') || 'ROOM-01').toUpperCase();
    $('roomInput').value = roomCode;
    const rows = new Map(); // slotId -> { tr, seats }

    const socket = io();

    function setStatus(text, online) {
      $('conn').textContent = text;
      $('conn').className = 'status ' + (online ? 'on' : 'off');
    }

    // Runs on the first connect and after EVERY reconnect (e.g. server restarted):
    // re-join the Socket.IO room and redraw from a fresh snapshot, so seats are always correct.
    socket.on('connect', () => { setStatus('connected', true); joinRoom(); });
    socket.on('disconnect', reason => setStatus(`disconnected (${reason})`, false));
    socket.io.on('reconnect_attempt', n => setStatus(`reconnecting... (attempt ${n})`, false));

    async function joinRoom() {
      $('error').textContent = '';
      let res;
      try {
        res = await socket.timeout(5000).emitWithAck('join:room', roomCode);
      } catch {
        return $('error').textContent = 'The server did not answer';
      }
      if (!res.ok) { $('slots').innerHTML = ''; return $('error').textContent = res.error; }
      $('title').textContent = `${res.room.roomCode} - ${res.room.name} (${res.room.building})`;
      document.title = `${res.room.roomCode} board`;
      render(res.slots);
    }

    function render(slots) {
      const tbody = $('slots');
      tbody.innerHTML = '';
      rows.clear();
      if (!slots.length) {
        const td = tbody.insertRow().insertCell();
        td.colSpan = 4;
        td.textContent = 'No slots for this room yet';
        return;
      }
      for (const s of slots) {
        const tr = tbody.insertRow();
        const end = s.startHour + 2;
        [s.date, `${pad(s.startHour)}:00 - ${pad(end)}:00`, s.seats].forEach(v => tr.insertCell().textContent = v);
        const left = tr.insertCell();
        left.className = 'left';
        rows.set(s.slotId, { tr, left });
        setSeatsLeft(s.slotId, s.seatsLeft, false);
      }
    }

    function setSeatsLeft(slotId, seatsLeft, flash) {
      const row = rows.get(slotId);
      if (!row) return;
      row.left.textContent = seatsLeft === 0 ? 'FULL' : seatsLeft;
      row.tr.classList.toggle('full', seatsLeft === 0);
      if (flash) { row.tr.classList.remove('flash'); void row.tr.offsetWidth; row.tr.classList.add('flash'); }
    }

    socket.on('slot:updated', ({ slotId, seatsLeft }) => setSeatsLeft(slotId, seatsLeft, true));

    socket.on('announcement', ({ message, at }) => {
      $('announceText').textContent = message; // user text: textContent, never innerHTML
      $('announceAt').textContent = new Date(at).toLocaleTimeString();
      $('announcement').style.display = 'block';
    });

    $('pick').onsubmit = e => {
      e.preventDefault();
      roomCode = $('roomInput').value.trim().toUpperCase();
      history.replaceState(null, '', `?room=${encodeURIComponent(roomCode)}`);
      joinRoom();
    };

    const pad = n => String(n).padStart(2, '0');
  </script>
</body>
</html>
